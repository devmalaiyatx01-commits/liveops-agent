name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # The eval is part of CI: a change that makes the analyst ship something it should not fails here.
      - name: Scenario evals
        run: |
          python -m liveops eval --policy rules --seeds 3 | tee eval.md
          python -m liveops eval --policy naive --seeds 3 | tee -a eval.md
          test "$(grep -c 'False ships: \*\*0\*\*' eval.md)" -eq 2
